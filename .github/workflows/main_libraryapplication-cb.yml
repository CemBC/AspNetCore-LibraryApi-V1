name: Build, test and deploy ASP.Net Core app to Azure Web App - libraryapplication-cb

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore dependencies
        run: dotnet restore ./LibraryApi.slnx

      - name: Build solution
        run: dotnet build ./LibraryApi.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./LibraryApi.slnx --configuration Release --no-build

      - name: Publish API
        run: dotnet publish ./LibraryApi/LibraryApi.csproj --configuration Release --no-build --output ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D60B698207C44CCF9DFB13D454BC95AF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_42BD7D032A0B42D9A160C44E0D1E253F }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_98D4CA2A5557401CBBAB7E4401036667 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'libraryapplication-cb'
          slot-name: 'Production'
          package: .